<header class="hero relative min-h-[88vh] mt-[0px] flex items-center justify-center text-center px-6 overflow-hidden">

  <picture class="absolute inset-0 w-full h-full">

    <!-- Mobile -->
    <source 
      media="(max-width: 768px)" 
      srcset="/assets/img/header-mobile.jpeg">

    <!-- Desktop -->
    <img 
      src="/assets/img/header.jpeg" 
      alt="Hero background"
      class="w-full h-full object-cover object-[center_35%] scale-105">

  </picture>

  <!-- Overlay suave (melhora leitura sem matar a imagem) -->
  <div class="absolute inset-0 bg-gradient-to-b 
              from-black/40 via-black/20 to-black/60"></div>

  <!-- Conteúdo do Hero -->
  <div class="relative max-w-lg text-white
              bg-black/10 backdrop-blur-[8px]
              px-6 py-8 rounded-2xl
              border border-white/10
              shadow-xl">

    <p class="uppercase tracking-[0.3em] text-cyan-200 text-xs animate-fade-in">
      {{ site.hero.greeting }}
    </p>

    <h1 class="text-3xl md:text-5xl font-bold mt-3 leading-tight animate-fade-in-up">
      {{ site.hero.name }}
    </h1>

    <p class="text-white/80 mt-3 text-sm md:text-base animate-fade-in-up delay-100">
      {{ site.hero.subtitle }}
    </p>

    <a href="{{ site.hero.cta_link }}"
       class="mt-6 inline-block bg-cyan-400 text-black px-5 py-2.5 rounded-full font-semibold text-sm
              hover:scale-105 hover:bg-cyan-300 transition transform duration-200
              animate-fade-in-up delay-200">

      {{ site.hero.cta_text }}

    </a>

  </div>

</header>
