<section id="projects" class="py-24 px-6 bg-[#0a1628]">
  <div class="max-w-6xl mx-auto">

    <h2 class="text-center text-3xl font-bold mb-14 text-white tracking-wide">
      Projetos
    </h2>

    <div class="grid md:grid-cols-3 gap-8">

      {% for project in site.projects %}
      <a href="{{ project.url }}"
         class="group bg-[#122b50] rounded-2xl overflow-hidden border border-white/5 hover:border-cyan-400/30 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(34,211,238,0.08)]">

        <!-- IMAGE -->
        <div class="overflow-hidden">
          <img
            src="{{ project.image }}"
            alt="{{ project.title }}"
            class="h-48 w-full object-cover transition-transform duration-500 group-hover:scale-110">
        </div>

        <!-- CONTENT -->
        <div class="p-6">

          <h3 class="text-xl font-bold text-white group-hover:text-cyan-300 transition-colors">
            {{ project.title }}
          </h3>

          <p class="text-gray-400 text-sm mt-2 leading-relaxed">
            {{ project.description }}
          </p>

          <!-- TAGS -->
          <div class="flex flex-wrap gap-2 mt-4">
            {% for tag in project.tags %}
              <span class="project-tag">
                {{ tag }}
              </span>
            {% endfor %}
          </div>

        </div>

      </a>
      {% endfor %}

    </div>

  </div>
</section>
