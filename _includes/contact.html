<section id="contacts" class="contacts-section py-20 px-6 bg-section border-t border-cyan-400/20">
  <div class="max-w-4xl mx-auto text-center">

    <h2 class="text-3xl font-bold text-white mb-4">
      Contato
    </h2>

    <p class="text-subtle mb-10 text-center">
      Entre em contato comigo por e-mail ou redes profissionais.
    </p>

    <div class="contact-grid">

      <a href="mailto:{{ site.contacts.email }}" class="contact-card">
        <span class="contact-icon">📧</span>
        <span class="contact-text">{{ site.contacts.email }}</span>
      </a>

      <a href="{{ site.contacts.github }}" target="_blank" class="contact-card">
        <span class="contact-icon">🐙</span>
        <span class="contact-text">GitHub</span>
      </a>

      <a href="{{ site.contacts.linkedin }}" target="_blank" class="contact-card">
        <span class="contact-icon">💼</span>
        <span class="contact-text">LinkedIn</span>
      </a>

    </div>

  </div>
</section>
