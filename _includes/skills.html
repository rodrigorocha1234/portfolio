<section id="skills" class="py-28 px-6 text-center bg-gradient-to-b from-[#070f1c] via-[#0a1a33] to-[#070f1c] relative overflow-hidden">

  <h2 class="text-3xl font-bold mb-10 text-white tracking-wide">
    Skills
  </h2>

  <div class="skills-grid max-w-6xl mx-auto px-4">

    {% for skill in site.skills %}

      <span class="skill-badge">
        <img src="{{ skill.icon }}" class="skill-icon">
        {{ skill.name }}
      </span>

    {% endfor %}

  </div>

</section>
