---
layout: default
---

<article class="min-h-screen bg-[#0a1628] text-gray-200 py-24 px-6">
  <div class="max-w-3xl mx-auto project-content">

    {% if page.image %}
    <img src="{{ page.image }}"
         class="w-full h-72 object-cover rounded-2xl mb-10">
    {% endif %}

    <h1 class="text-3xl font-bold text-white mb-6">
      {{ page.title }}
    </h1>

    <div class="flex flex-wrap gap-2 mb-10">
      {% for tag in page.tags %}
        <span class="project-tag">{{ tag }}</span>
      {% endfor %}
    </div>

    <div class="prose-custom">
      {{ content }}
    </div>

  </div>
</article>
